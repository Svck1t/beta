<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control Facturas</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-border: #e2e5ea;
    --ink: #1f2937;
    --ink-dim: #6b7280;
    --blue: #1d4ed8;
    --blue-light: #dbe4fc;
    --navy: #16213e;
    --navy-border: #22304f;
    --ok-bg: #dcfce7;
    --ok-ink: #15803d;
    --err-bg: #fee2e2;
    --err-ink: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    background: var(--navy);
    border-bottom: 1px solid var(--navy-border);
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .wl { color: #7fa1ff; font-weight: 700; font-size: 14px; font-family: monospace; }
  .brand .name { color: #fff; font-weight: 600; }
  nav { display: flex; gap: 4px; }
  nav button {
    background: transparent;
    border: none;
    color: #a8b3c7;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  nav button.active { background: var(--blue); color: #fff; }

  main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
  .tab { display: none; }
  .tab.active { display: block; }

  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: var(--ink-dim); font-size: 14px; margin-top: 0; margin-bottom: 20px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
  }

  label { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 4px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: var(--blue);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: none; }
  .msg.ok { background: var(--ok-bg); color: var(--ok-ink); display: block; }
  .msg.err { background: var(--err-bg); color: var(--err-ink); display: block; }

  .buscar-form { display: flex; gap: 8px; margin-bottom: 20px; }
  .buscar-form input { flex: 1; }
  .buscar-form button {
    background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 0 18px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
  }

  .factura-detalle div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--panel-border); font-size: 14px; }
  .factura-detalle div:last-child { border-bottom: none; }
  .factura-detalle span.label { color: var(--ink-dim); }

  .listado-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--panel-border);
  }
  .listado-row:last-child { border-bottom: none; }
  .listado-fecha { min-width: 90px; font-size: 13px; color: var(--ink-dim); }
  .listado-fecha .dia { font-size: 11px; text-transform: uppercase; }
  .listado-main { flex: 1; }
  .listado-main .num { font-weight: 700; font-size: 14px; }
  .listado-main .obs { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }
  .listado-hora { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }

  .filtros-bar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .filtros-bar .campo { flex: 1; min-width: 140px; }
  .filtros-bar label { margin: 0 0 4px; }
  .filtros-bar input { margin: 0; }
  .filtros-bar button {
    background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .filtros-bar button.limpiar { background: var(--bg); color: var(--ink-dim); border: 1px solid var(--panel-border); }

  .tabla-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }
  table.listado { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.listado thead { background: var(--navy); }
  table.listado th {
    color: #a8b3c7;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 12px 14px;
    text-align: left;
    white-space: nowrap;
  }
  table.listado td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--panel-border);
    color: var(--ink);
    white-space: nowrap;
  }
  table.listado tbody tr:last-child td { border-bottom: none; }
  table.listado tbody tr:hover { background: var(--bg); }
  table.listado td.num { font-weight: 700; }
  table.listado td.obs { white-space: normal; color: var(--ink-dim); max-width: 220px; }
  table.listado .resultados-count { padding: 12px 14px; font-size: 13px; color: var(--ink-dim); }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .kpi .num { font-size: 26px; font-weight: 700; color: var(--blue); }
  .kpi .label { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--ink-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }

  .loading { color: var(--ink-dim); font-size: 14px; }

  .acciones-cell { white-space: nowrap; }
  .btn-mini {
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink-dim);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    margin-right: 6px;
  }
  .btn-mini:hover { background: var(--bg); }
  .btn-mini.eliminar { color: var(--err-ink); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--panel);
    border-radius: 10px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
  }
  .modal-box h2 { font-size: 17px; margin: 0 0 4px; }
  .modal-box .sub { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; border: none; }
  .modal-actions .guardar { background: var(--blue); color: #fff; }
  .modal-actions .cancelar { background: var(--bg); color: var(--ink-dim); border: 1px solid var(--panel-border); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="wl">WL</span>
      <span class="name">Control Facturas</span>
    </div>
    <nav>
      <button class="tab-btn active" data-tab="ingresar">Ingresar</button>
      <button class="tab-btn" data-tab="buscar">Buscar</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    </nav>
  </div>
</header>

<main>

  <!-- INGRESAR -->
  <section id="tab-ingresar" class="tab active">
    <h1>Ingresar factura</h1>
    <p class="sub">Día, mes y año se calculan solos a partir de la fecha.</p>
    <form id="form-ingresar" class="card">
      <label for="numero">N° Factura</label>
      <input id="numero" type="text" inputmode="numeric" required placeholder="Ej: 548025" />

      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" required />

      <label for="observacion">Observación</label>
      <input id="observacion" type="text" placeholder="CORTE, RETIRO, N/C, GUIA..." />

      <button id="btn-ingresar" class="primary" type="submit">Registrar factura</button>
      <div id="msg-ingresar" class="msg"></div>
    </form>
  </section>

  <!-- BUSCAR + LISTADO -->
  <section id="tab-buscar" class="tab">
    <h1>Facturas</h1>
    <p class="sub">Filtra por fecha, número u observación, o revisa el listado completo.</p>

    <div class="filtros-bar">
      <div class="campo">
        <label for="filtro-fecha">Fecha</label>
        <input id="filtro-fecha" type="date" />
      </div>
      <div class="campo" style="flex: 2;">
        <label for="filtro-texto">N° Factura / Observación</label>
        <input id="filtro-texto" type="text" placeholder="Ej: 548025 o CORTE..." />
      </div>
      <button id="btn-filtrar" type="button">Buscar</button>
      <button id="btn-limpiar-filtro" class="limpiar" type="button">Limpiar</button>
    </div>

    <div class="tabla-wrap">
      <div id="listado-content" class="loading" style="padding:16px;">Cargando...</div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="tab-dashboard" class="tab">
    <h1>Dashboard</h1>
    <p class="sub">Resumen general de facturas registradas.</p>
    <div id="dashboard-content" class="loading">Cargando...</div>
  </section>

</main>

<!-- MODAL EDITAR -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <h2>Editar factura</h2>
    <p class="sub">N° <span id="modal-numero"></span></p>
    <form id="form-editar">
      <label for="modal-fecha">Fecha</label>
      <input id="modal-fecha" type="date" required />

      <label for="modal-hora">Hora</label>
      <input id="modal-hora" type="time" />

      <label for="modal-observacion">Observación</label>
      <input id="modal-observacion" type="text" />

      <div id="modal-msg" class="msg"></div>

      <div class="modal-actions">
        <button type="button" class="cancelar" id="modal-cancelar">Cancelar</button>
        <button type="submit" class="guardar" id="modal-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ⚠️ Reemplaza esta URL por la de tu Apps Script Web App (paso "Implementar")
  const API_URL = "https://script.google.com/macros/s/AKfycbxchbWwNZnnx72MF5d_NZockO1XD56He_Ti-nIb3Hx7HLb_0u-gpqRTh0Vy3c23BrXl/exec";
  const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  let registrosCache = null; // se llena la primera vez que se abre "Buscar"

  // ----- Navegación entre tabs -----
  const tabBtns = document.querySelectorAll(".tab-btn");
  const tabs = document.querySelectorAll(".tab");
  tabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      tabBtns.forEach((b) => b.classList.remove("active"));
      tabs.forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "dashboard") cargarDashboard();
      if (btn.dataset.tab === "buscar") cargarListado();
    });
  });

  // ----- Ingresar -----
  const formIngresar = document.getElementById("form-ingresar");
  const btnIngresar = document.getElementById("btn-ingresar");
  const msgIngresar = document.getElementById("msg-ingresar");

  document.getElementById("fecha").value = new Date().toISOString().slice(0, 10);

  formIngresar.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgIngresar.className = "msg";
    msgIngresar.textContent = "";

    const numeroIngresado = document.getElementById("numero").value.trim();

    // Chequeo rápido en el navegador con lo que ya tengamos cargado (no reemplaza al del servidor)
    if (registrosCache && registrosCache.some((r) => String(r.numero) === numeroIngresado)) {
      msgIngresar.className = "msg err";
      msgIngresar.textContent = "Esa factura ya está registrada";
      return;
    }

    btnIngresar.disabled = true;
    btnIngresar.textContent = "Registrando...";

    const ahora = new Date();
    const horaActual = String(ahora.getHours()).padStart(2, "0") + ":" + String(ahora.getMinutes()).padStart(2, "0");

    const payload = {
      numero: document.getElementById("numero").value.trim(),
      fecha: document.getElementById("fecha").value,
      hora: horaActual,
      observacion: document.getElementById("observacion").value.trim(),
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!data.ok) {
        msgIngresar.className = "msg err";
        msgIngresar.textContent = data.error || "No se pudo registrar";
      } else {
        msgIngresar.className = "msg ok";
        msgIngresar.textContent = data.mensaje;

        // Agregarla al instante al listado local (sin esperar recarga)
        const [anio, mes, dia] = payload.fecha.split("-").map(Number);
        const fechaObj = new Date(anio, mes - 1, dia);
        const nuevoRegistro = {
          numero: payload.numero,
          fecha: String(dia).padStart(2, "0") + "-" + String(mes).padStart(2, "0") + "-" + anio,
          fechaISO: payload.fecha,
          dia: DIAS[fechaObj.getDay()],
          hora: payload.hora,
          observacion: payload.observacion,
          mes: MESES[mes - 1],
          anio: anio,
        };
        if (registrosCache) {
          registrosCache.unshift(nuevoRegistro);
          renderListado(filtrar(registrosCache));
        }

        formIngresar.reset();
        document.getElementById("fecha").value = new Date().toISOString().slice(0, 10);
      }
    } catch (err) {
      msgIngresar.className = "msg err";
      msgIngresar.textContent = "Error de conexión: " + err.message;
    } finally {
      btnIngresar.disabled = false;
      btnIngresar.textContent = "Registrar factura";
    }
  });

  // ----- Buscar + Listado (unificado) -----
  const filtroTexto = document.getElementById("filtro-texto");
  const filtroFecha = document.getElementById("filtro-fecha");
  const btnFiltrar = document.getElementById("btn-filtrar");
  const btnLimpiarFiltro = document.getElementById("btn-limpiar-filtro");

  function renderListado(registros) {
    const el = document.getElementById("listado-content");
    if (registros.length === 0) {
      el.innerHTML = '<p class="loading" style="padding:16px;">No hay facturas que coincidan.</p>';
      return;
    }
    el.innerHTML = `
      <table class="listado">
        <thead>
          <tr>
            <th>N° Factura</th>
            <th>Fecha</th>
            <th>Día</th>
            <th>Hora</th>
            <th>Observación</th>
            <th>Mes</th>
            <th>Año</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${registros
            .map(
              (r) => `
            <tr>
              <td class="num">${r.numero}</td>
              <td>${r.fecha}</td>
              <td>${r.dia || "-"}</td>
              <td>${r.hora || "-"}</td>
              <td class="obs">${r.observacion || "-"}</td>
              <td>${r.mes || "-"}</td>
              <td>${r.anio || "-"}</td>
              <td class="acciones-cell">
                <button class="btn-mini btn-editar" data-numero="${r.numero}">Editar</button>
                <button class="btn-mini eliminar btn-eliminar" data-numero="${r.numero}">Eliminar</button>
              </td>
            </tr>`
            )
            .join("")}
        </tbody>
      </table>
      <div class="resultados-count">${registros.length} factura${registros.length === 1 ? "" : "s"}</div>
    `;

    // Conectar botones de acciones de esta tabla
    el.querySelectorAll(".btn-editar").forEach((btn) => {
      btn.addEventListener("click", () => abrirModalEditar(btn.dataset.numero));
    });
    el.querySelectorAll(".btn-eliminar").forEach((btn) => {
      btn.addEventListener("click", () => eliminarFactura(btn.dataset.numero));
    });
  }

  async function cargarListado() {
    const el = document.getElementById("listado-content");
    if (registrosCache) {
      renderListado(filtrar(registrosCache));
      return;
    }
    el.innerHTML = '<p class="loading" style="padding:16px;">Cargando...</p>';

    try {
      const res = await fetch(`${API_URL}?action=listado`);
      const data = await res.json();

      if (!data.ok) {
        el.innerHTML = `<div class="msg err" style="margin:16px;">${data.error}</div>`;
        return;
      }

      registrosCache = data.registros;
      renderListado(filtrar(registrosCache));
    } catch (err) {
      el.innerHTML = `<div class="msg err" style="margin:16px;">Error de conexión: ${err.message}</div>`;
    }
  }

  function filtrar(registros) {
    const t = filtroTexto.value.trim().toLowerCase();
    const f = filtroFecha.value; // yyyy-mm-dd
    return registros.filter((r) => {
      const coincideTexto =
        !t ||
        String(r.numero).toLowerCase().includes(t) ||
        (r.observacion || "").toLowerCase().includes(t);
      const coincideFecha = !f || r.fechaISO === f;
      return coincideTexto && coincideFecha;
    });
  }

  btnFiltrar.addEventListener("click", () => {
    if (registrosCache) renderListado(filtrar(registrosCache));
  });
  filtroTexto.addEventListener("input", () => {
    if (registrosCache) renderListado(filtrar(registrosCache));
  });
  filtroFecha.addEventListener("change", () => {
    if (registrosCache) renderListado(filtrar(registrosCache));
  });
  btnLimpiarFiltro.addEventListener("click", () => {
    filtroTexto.value = "";
    filtroFecha.value = "";
    if (registrosCache) renderListado(registrosCache);
  });

  // ----- Dashboard -----
  let dashboardCargado = false;
  async function cargarDashboard() {
    if (dashboardCargado) return;
    const el = document.getElementById("dashboard-content");
    el.innerHTML = '<p class="loading">Cargando...</p>';

    try {
      const res = await fetch(`${API_URL}?action=dashboard`);
      const data = await res.json();

      if (!data.ok) {
        el.innerHTML = `<div class="msg err">${data.error}</div>`;
        return;
      }

      const filasMes = data.porMes
        .map(
          (m) => `
        <tr>
          <td>${m.mes}</td>
          <td class="num">${m.total}</td>
          <td>${m.normal}</td>
          <td>${m.corte}</td>
          <td>${m.guia}</td>
          <td>${m.retiro}</td>
          <td>${m.nc}</td>
        </tr>`
        )
        .join("");

      const t = data.totalAnio;

      const filasUltimas = data.ultimas
        .map(
          (f) => `<tr><td class="num">${f.numero}</td><td>${f.fecha}</td><td>${f.hora || "-"}</td><td class="obs">${f.observacion || "-"}</td></tr>`
        )
        .join("");

      el.innerHTML = `
        <div class="kpis">
          <div class="kpi"><div class="num">${data.total}</div><div class="label">Facturas totales</div></div>
          <div class="kpi"><div class="num">${data.esteMes}</div><div class="label">Este mes</div></div>
        </div>

        <div class="tabla-wrap" style="margin-bottom:20px;">
          <div style="padding:16px 16px 0;">
            <h2 style="font-size:15px; margin:0 0 2px;">Resumen anual ${data.anio}</h2>
            <p class="sub" style="margin-bottom:12px;">Detalle mes a mes por tipo de factura.</p>
          </div>
          <table class="listado">
            <thead>
              <tr><th>Mes</th><th>Total</th><th>Normal</th><th>Corte</th><th>Guía</th><th>Retiro</th><th>N/C</th></tr>
            </thead>
            <tbody>
              ${filasMes}
              <tr style="background:var(--bg); font-weight:700;">
                <td>TOTAL AÑO</td><td>${t.total}</td><td>${t.normal}</td><td>${t.corte}</td><td>${t.guia}</td><td>${t.retiro}</td><td>${t.nc}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="tabla-wrap">
          <div style="padding:16px 16px 0;">
            <h2 style="font-size:15px; margin:0 0 12px;">Últimas registradas</h2>
          </div>
          <table class="listado">
            <thead><tr><th>N°</th><th>Fecha</th><th>Hora</th><th>Observación</th></tr></thead>
            <tbody>${filasUltimas}</tbody>
          </table>
        </div>`;
      dashboardCargado = true;
    } catch (err) {
      el.innerHTML = `<div class="msg err">Error de conexión: ${err.message}</div>`;
    }
  }
  // ----- Editar / Eliminar -----
  const modalOverlay = document.getElementById("modal-overlay");
  const formEditar = document.getElementById("form-editar");
  const modalMsg = document.getElementById("modal-msg");
  const modalGuardar = document.getElementById("modal-guardar");
  let numeroEnEdicion = null;

  function abrirModalEditar(numero) {
    const registro = registrosCache.find((r) => String(r.numero) === String(numero));
    if (!registro) return;
    numeroEnEdicion = numero;

    document.getElementById("modal-numero").textContent = registro.numero;
    document.getElementById("modal-fecha").value = registro.fechaISO || "";
    document.getElementById("modal-hora").value = registro.hora || "";
    document.getElementById("modal-observacion").value = registro.observacion || "";
    modalMsg.className = "msg";
    modalMsg.textContent = "";
    modalOverlay.classList.add("active");
  }

  function cerrarModal() {
    modalOverlay.classList.remove("active");
    numeroEnEdicion = null;
  }

  document.getElementById("modal-cancelar").addEventListener("click", cerrarModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) cerrarModal();
  });

  formEditar.addEventListener("submit", async (e) => {
    e.preventDefault();
    modalMsg.className = "msg";
    modalMsg.textContent = "";
    modalGuardar.disabled = true;
    modalGuardar.textContent = "Guardando...";

    const fechaVal = document.getElementById("modal-fecha").value;
    const horaVal = document.getElementById("modal-hora").value;
    const obsVal = document.getElementById("modal-observacion").value.trim();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          accion: "editar",
          numero: numeroEnEdicion,
          fecha: fechaVal,
          hora: horaVal,
          observacion: obsVal,
        }),
      });
      const data = await res.json();

      if (!data.ok) {
        modalMsg.className = "msg err";
        modalMsg.textContent = data.error || "No se pudo actualizar";
        return;
      }

      // Actualizar el registro en la caché local
      const [anio, mes, dia] = fechaVal.split("-").map(Number);
      const fechaObj = new Date(anio, mes - 1, dia);
      const idx = registrosCache.findIndex((r) => String(r.numero) === String(numeroEnEdicion));
      if (idx !== -1) {
        registrosCache[idx] = {
          ...registrosCache[idx],
          fecha: String(dia).padStart(2, "0") + "-" + String(mes).padStart(2, "0") + "-" + anio,
          fechaISO: fechaVal,
          dia: DIAS[fechaObj.getDay()],
          hora: horaVal,
          observacion: obsVal,
          mes: MESES[mes - 1],
          anio: anio,
        };
      }
      renderListado(filtrar(registrosCache));
      cerrarModal();
    } catch (err) {
      modalMsg.className = "msg err";
      modalMsg.textContent = "Error de conexión: " + err.message;
    } finally {
      modalGuardar.disabled = false;
      modalGuardar.textContent = "Guardar";
    }
  });

  async function eliminarFactura(numero) {
    if (!confirm(`¿Eliminar la factura N° ${numero}? Esta acción no se puede deshacer.`)) return;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ accion: "eliminar", numero }),
      });
      const data = await res.json();

      if (!data.ok) {
        alert(data.error || "No se pudo eliminar");
        return;
      }

      registrosCache = registrosCache.filter((r) => String(r.numero) !== String(numero));
      renderListado(filtrar(registrosCache));
    } catch (err) {
      alert("Error de conexión: " + err.message);
    }
  }
</script>

</body>
</html>
