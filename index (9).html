<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control Facturas</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-border: #e2e5ea;
    --ink: #1f2937;
    --ink-dim: #6b7280;
    --blue: #1d4ed8;
    --blue-light: #dbe4fc;
    --navy: #16213e;
    --navy-border: #22304f;
    --ok-bg: #dcfce7;
    --ok-ink: #15803d;
    --err-bg: #fee2e2;
    --err-ink: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    background: var(--navy);
    border-bottom: 1px solid var(--navy-border);
  }
  .header-inner {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .wl { color: #7fa1ff; font-weight: 700; font-size: 14px; font-family: monospace; }
  .brand .name { color: #fff; font-weight: 600; }
  nav { display: flex; gap: 4px; }
  nav button {
    background: transparent;
    border: none;
    color: #a8b3c7;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  nav button.active { background: var(--blue); color: #fff; }

  main { max-width: 640px; margin: 32px auto; padding: 0 16px; }
  .tab { display: none; }
  .tab.active { display: block; }

  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: var(--ink-dim); font-size: 14px; margin-top: 0; margin-bottom: 20px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
  }

  label { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 4px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: var(--blue);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: none; }
  .msg.ok { background: var(--ok-bg); color: var(--ok-ink); display: block; }
  .msg.err { background: var(--err-bg); color: var(--err-ink); display: block; }

  .buscar-form { display: flex; gap: 8px; margin-bottom: 20px; }
  .buscar-form input { flex: 1; }
  .buscar-form button {
    background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 0 18px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
  }

  .factura-detalle div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--panel-border); font-size: 14px; }
  .factura-detalle div:last-child { border-bottom: none; }
  .factura-detalle span.label { color: var(--ink-dim); }

  .listado-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--panel-border);
  }
  .listado-row:last-child { border-bottom: none; }
  .listado-fecha { min-width: 90px; font-size: 13px; color: var(--ink-dim); }
  .listado-fecha .dia { font-size: 11px; text-transform: uppercase; }
  .listado-main { flex: 1; }
  .listado-main .num { font-weight: 700; font-size: 14px; }
  .listado-main .obs { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }
  .listado-hora { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .kpi .num { font-size: 26px; font-weight: 700; color: var(--blue); }
  .kpi .label { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--ink-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }

  .loading { color: var(--ink-dim); font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="wl">WL</span>
      <span class="name">Control Facturas</span>
    </div>
    <nav>
      <button class="tab-btn active" data-tab="ingresar">Ingresar</button>
      <button class="tab-btn" data-tab="buscar">Buscar</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    </nav>
  </div>
</header>

<main>

  <!-- INGRESAR -->
  <section id="tab-ingresar" class="tab active">
    <h1>Ingresar factura</h1>
    <p class="sub">Día, mes y año se calculan solos a partir de la fecha.</p>
    <form id="form-ingresar" class="card">
      <label for="numero">N° Factura</label>
      <input id="numero" type="text" inputmode="numeric" required placeholder="Ej: 548025" />

      <div class="row2">
        <div>
          <label for="fecha">Fecha</label>
          <input id="fecha" type="date" required />
        </div>
        <div>
          <label for="hora">Hora</label>
          <input id="hora" type="time" />
        </div>
      </div>

      <label for="observacion">Observación</label>
      <input id="observacion" type="text" placeholder="CORTE, RETIRO, N/C, GUIA..." />

      <button id="btn-ingresar" class="primary" type="submit">Registrar factura</button>
      <div id="msg-ingresar" class="msg"></div>
    </form>
  </section>

  <!-- BUSCAR + LISTADO -->
  <section id="tab-buscar" class="tab">
    <h1>Facturas</h1>
    <p class="sub">Filtra por número u observación, o revisa el listado completo.</p>
    <input id="filtro-listado" type="text" placeholder="Filtrar por N° factura u observación..." style="margin-bottom:16px;" />
    <div id="listado-content" class="card loading">Cargando...</div>
  </section>

  <!-- DASHBOARD -->
  <section id="tab-dashboard" class="tab">
    <h1>Dashboard</h1>
    <p class="sub">Resumen general de facturas registradas.</p>
    <div id="dashboard-content" class="loading">Cargando...</div>
  </section>

</main>

<script>
  // ⚠️ Reemplaza esta URL por la de tu Apps Script Web App (paso "Implementar")
  const API_URL = "https://script.google.com/macros/s/AKfycbxchbWwNZnnx72MF5d_NZockO1XD56He_Ti-nIb3Hx7HLb_0u-gpqRTh0Vy3c23BrXl/exec";
  const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  let registrosCache = null; // se llena la primera vez que se abre "Buscar"

  // ----- Navegación entre tabs -----
  const tabBtns = document.querySelectorAll(".tab-btn");
  const tabs = document.querySelectorAll(".tab");
  tabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      tabBtns.forEach((b) => b.classList.remove("active"));
      tabs.forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "dashboard") cargarDashboard();
      if (btn.dataset.tab === "buscar") cargarListado();
    });
  });

  // ----- Ingresar -----
  const formIngresar = document.getElementById("form-ingresar");
  const btnIngresar = document.getElementById("btn-ingresar");
  const msgIngresar = document.getElementById("msg-ingresar");

  document.getElementById("fecha").value = new Date().toISOString().slice(0, 10);

  formIngresar.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgIngresar.className = "msg";
    msgIngresar.textContent = "";
    btnIngresar.disabled = true;
    btnIngresar.textContent = "Registrando...";

    const payload = {
      numero: document.getElementById("numero").value.trim(),
      fecha: document.getElementById("fecha").value,
      hora: document.getElementById("hora").value,
      observacion: document.getElementById("observacion").value.trim(),
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!data.ok) {
        msgIngresar.className = "msg err";
        msgIngresar.textContent = data.error || "No se pudo registrar";
      } else {
        msgIngresar.className = "msg ok";
        msgIngresar.textContent = data.mensaje;

        // Agregarla al instante al listado local (sin esperar recarga)
        const [anio, mes, dia] = payload.fecha.split("-").map(Number);
        const fechaObj = new Date(anio, mes - 1, dia);
        const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        const nuevoRegistro = {
          numero: payload.numero,
          fecha: String(dia).padStart(2, "0") + "-" + String(mes).padStart(2, "0") + "-" + anio,
          dia: DIAS[fechaObj.getDay()],
          hora: payload.hora,
          observacion: payload.observacion,
          mes: MESES[mes - 1],
          anio: anio,
        };
        if (registrosCache) {
          registrosCache.unshift(nuevoRegistro);
          renderListado(registrosCache);
        }

        formIngresar.reset();
        document.getElementById("fecha").value = new Date().toISOString().slice(0, 10);
      }
    } catch (err) {
      msgIngresar.className = "msg err";
      msgIngresar.textContent = "Error de conexión: " + err.message;
    } finally {
      btnIngresar.disabled = false;
      btnIngresar.textContent = "Registrar factura";
    }
  });

  // ----- Buscar + Listado (unificado) -----
  const filtroInput = document.getElementById("filtro-listado");

  function renderListado(registros) {
    const el = document.getElementById("listado-content");
    if (registros.length === 0) {
      el.innerHTML = '<p class="loading">No hay facturas que coincidan.</p>';
      return;
    }
    el.innerHTML = registros
      .map(
        (r) => `
      <div class="listado-row">
        <div class="listado-fecha">
          <div>${r.fecha}</div>
          <div class="dia">${r.dia || ""}</div>
        </div>
        <div class="listado-main">
          <div class="num">N° ${r.numero}</div>
          <div class="obs">${r.observacion || "-"}</div>
        </div>
        <div class="listado-hora">${r.hora || "-"}</div>
      </div>`
      )
      .join("");
  }

  async function cargarListado() {
    const el = document.getElementById("listado-content");
    if (registrosCache) {
      renderListado(filtrar(registrosCache, filtroInput.value));
      return;
    }
    el.innerHTML = '<p class="loading">Cargando...</p>';

    try {
      const res = await fetch(`${API_URL}?action=listado`);
      const data = await res.json();

      if (!data.ok) {
        el.innerHTML = `<div class="msg err">${data.error}</div>`;
        return;
      }

      registrosCache = data.registros;
      renderListado(filtrar(registrosCache, filtroInput.value));
    } catch (err) {
      el.innerHTML = `<div class="msg err">Error de conexión: ${err.message}</div>`;
    }
  }

  function filtrar(registros, texto) {
    const t = texto.trim().toLowerCase();
    if (!t) return registros;
    return registros.filter(
      (r) =>
        String(r.numero).toLowerCase().includes(t) ||
        (r.observacion || "").toLowerCase().includes(t)
    );
  }

  filtroInput.addEventListener("input", () => {
    if (registrosCache) renderListado(filtrar(registrosCache, filtroInput.value));
  });

  // ----- Dashboard -----
  let dashboardCargado = false;
  async function cargarDashboard() {
    if (dashboardCargado) return;
    const el = document.getElementById("dashboard-content");
    el.innerHTML = '<p class="loading">Cargando...</p>';

    try {
      const res = await fetch(`${API_URL}?action=dashboard`);
      const data = await res.json();

      if (!data.ok) {
        el.innerHTML = `<div class="msg err">${data.error}</div>`;
        return;
      }

      const filas = data.ultimas
        .map((f) => `<tr><td>${f.numero}</td><td>${f.fecha}</td><td>${f.observacion || "-"}</td></tr>`)
        .join("");

      const filasMes = data.porMes
        .map((m) => `<tr><td>${m.periodo}</td><td>${m.cantidad}</td></tr>`)
        .join("");

      el.innerHTML = `
        <div class="kpis">
          <div class="kpi"><div class="num">${data.total}</div><div class="label">Facturas totales</div></div>
          <div class="kpi"><div class="num">${data.esteMes}</div><div class="label">Este mes</div></div>
        </div>
        <div class="card" style="margin-bottom:20px;">
          <h2 style="font-size:15px; margin-top:0;">Por mes</h2>
          <table><thead><tr><th>Periodo</th><th>Cantidad</th></tr></thead><tbody>${filasMes}</tbody></table>
        </div>
        <div class="card">
          <h2 style="font-size:15px; margin-top:0;">Últimas registradas</h2>
          <table><thead><tr><th>N°</th><th>Fecha</th><th>Observación</th></tr></thead><tbody>${filas}</tbody></table>
        </div>`;
      dashboardCargado = true;
    } catch (err) {
      el.innerHTML = `<div class="msg err">Error de conexión: ${err.message}</div>`;
    }
  }
</script>

</body>
</html>
